server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = / {
    return 301 /main;
  }

  location = /maximilian {
    return 301 /maximilian/;
  }

  location = /main {
    try_files /main.html =404;
  }

  location = /jantje {
    try_files /jantje.html =404;
  }

  location /maximilian/ {
    try_files $uri $uri/ /maximilian/index.html;
  }

  location / {
    try_files $uri =404;
  }
}
