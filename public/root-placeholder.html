<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>joppien.dev</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #02182b;
        --bg-soft: #0b253d;
        --text: #f7f8fb;
        --muted: #9fb3c8;
        --accent: #d7263d;
        --border: rgba(159, 179, 200, 0.24);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Georgia, serif;
        color: var(--text);
        background:
          radial-gradient(circle at 18% 20%, rgba(215, 38, 61, 0.26), transparent 24%),
          radial-gradient(circle at 84% 18%, rgba(76, 118, 168, 0.2), transparent 22%),
          linear-gradient(180deg, #072038 0%, var(--bg) 100%);
      }

      main {
        width: min(100%, 760px);
        padding: 48px;
        border: 1px solid var(--border);
        border-radius: 28px;
        background: linear-gradient(180deg, rgba(11, 37, 61, 0.92), rgba(2, 24, 43, 0.96));
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.28);
      }

      .eyebrow {
        margin: 0 0 16px;
        color: var(--accent);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(40px, 8vw, 74px);
        line-height: 0.95;
        letter-spacing: -0.04em;
      }

      p {
        margin: 24px 0 0;
        max-width: 540px;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.8;
      }

      a {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 36px;
        padding: 14px 24px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }

      a:hover {
        filter: brightness(1.06);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">joppien.dev</p>
      <h1>Mehr Seiten folgen.</h1>
      <p>
        Die persönliche Portfolio-Seite von Maximilian Joppien ist bereits live.
        Weitere Bereiche und Projekte werden hier nach und nach ergänzt.
      </p>
      <a href="/maximilian/">Zu Maximilian</a>
    </main>
  </body>
  </html>
