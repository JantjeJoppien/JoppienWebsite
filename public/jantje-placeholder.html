<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>joppien.dev/jantje</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #02182b;
        --text: #f7f8fb;
        --muted: #9fb3c8;
        --accent: #d7263d;
        --border: rgba(159, 179, 200, 0.24);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Georgia, serif;
        color: var(--text);
        background:
          radial-gradient(circle at 16% 18%, rgba(215, 38, 61, 0.22), transparent 24%),
          linear-gradient(180deg, #072038 0%, var(--bg) 100%);
      }

      main {
        width: min(100%, 720px);
        padding: 42px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: rgba(11, 37, 61, 0.92);
      }

      a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 700;
      }

      p {
        color: var(--muted);
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Jantje</h1>
      <p>Diese Seite ist aktuell noch ein Platzhalter.</p>
      <p><a href="/main">Zurück zu main</a></p>
    </main>
  </body>
  </html>
