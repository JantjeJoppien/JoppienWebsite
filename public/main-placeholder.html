<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>joppien.dev/main</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #02182b;
        --bg-soft: #0b253d;
        --text: #f7f8fb;
        --muted: #9fb3c8;
        --accent: #d7263d;
        --border: rgba(159, 179, 200, 0.24);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Georgia, serif;
        color: var(--text);
        background:
          radial-gradient(circle at 18% 20%, rgba(215, 38, 61, 0.26), transparent 24%),
          radial-gradient(circle at 84% 18%, rgba(76, 118, 168, 0.2), transparent 22%),
          linear-gradient(180deg, #072038 0%, var(--bg) 100%);
      }

      .topbar {
        position: sticky;
        top: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 22px 32px;
        border-bottom: 1px solid var(--border);
        background: rgba(2, 24, 43, 0.78);
        backdrop-filter: blur(12px);
      }

      .brand {
        color: var(--text);
        text-decoration: none;
        font-size: 22px;
        font-weight: 800;
      }

      .brand span {
        color: var(--accent);
      }

      .topbar nav {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }

      .topbar nav a {
        padding: 10px 16px;
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--text);
        text-decoration: none;
        font-size: 14px;
      }

      .topbar nav a:hover,
      .topbar nav a.active {
        background: rgba(255, 255, 255, 0.08);
      }

      main {
        min-height: calc(100vh - 78px);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .panel {
        width: min(100%, 760px);
        padding: 48px;
        border: 1px solid var(--border);
        border-radius: 28px;
        background: linear-gradient(180deg, rgba(11, 37, 61, 0.92), rgba(2, 24, 43, 0.96));
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.28);
      }

      .eyebrow {
        margin: 0 0 16px;
        color: var(--accent);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(40px, 8vw, 74px);
        line-height: 0.95;
        letter-spacing: -0.04em;
      }

      p {
        margin: 24px 0 0;
        max-width: 540px;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.8;
      }

      .cta {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 36px;
        padding: 14px 24px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }

      .cta:hover {
        filter: brightness(1.06);
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/main">Joppien<span>.</span></a>
      <nav aria-label="Bereiche">
        <a href="/jantje/">Jantje</a>
        <a class="active" href="/maximilian/">Maxi</a>
      </nav>
    </header>
    <main>
      <section class="panel">
        <p class="eyebrow">joppien.dev/main</p>
        <h1>Die Startseite für joppien.dev.</h1>
        <p>
          Von hier aus gehen die einzelnen Bereiche der Seite weiter. Maximilians
          Portfolio ist bereits live, weitere Seiten wie Jantje folgen als Nächstes.
        </p>
        <a class="cta" href="/maximilian/">Zu Maxi</a>
      </section>
    </main>
  </body>
  </html>
